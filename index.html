    <!-- ── NUCLEAR SCROLL UNLOCKER ─────────────────────────────────────────
         Radix UI / Vaul injetam overflow:hidden no body via JS.
         Este script intercepta a propriedade e neutraliza qualquer bloqueio.
         Roda antes do React montar — zero dependência de bundle.
    ──────────────────────────────────────────────────────────────────────── -->
    <script>
      (function () {
        // Intercepta atribuição de overflow no body e html
        function interceptOverflow(el) {
          if (!el) return;
          var descriptor = Object.getOwnPropertyDescriptor(el, 'overflow') ||
            Object.getOwnPropertyDescriptor(CSSStyleDeclaration.prototype, 'overflow');
          if (!descriptor) return;

          // Override style.overflow
          try {
            Object.defineProperty(el.style, 'overflow', {
              set: function (val) {
                // Nunca deixa setar 'hidden' no elemento raiz
                if (val === 'hidden' || val === 'clip') {
                  // Permite apenas em elementos que não são body/html
                  return;
                }
                CSSStyleDeclaration.prototype.overflow = val;
              },
              get: function () {
                return CSSStyleDeclaration.prototype.overflow;
              },
              configurable: true,
            });
          } catch (e) {
            // Fallback: watcher de 300ms
          }
        }

        // Watcher de segurança: desbloqueio a cada 300ms
        function unlock() {
          var b = document.body;
          var h = document.documentElement;
          if (!b || !h) return;

          // Reseta overflow inline se travado
          if (b.style.overflow === 'hidden' || b.style.overflowY === 'hidden') {
            b.style.overflow = '';
            b.style.overflowY = '';
            b.style.paddingRight = '';
          }
          if (h.style.overflow === 'hidden' || h.style.overflowY === 'hidden') {
            h.style.overflow = '';
            h.style.overflowY = '';
          }

          // Remove classes de bloqueio
          b.classList.remove('lock-scroll', 'no-scroll', 'modal-open', 'overflow-hidden');
          h.classList.remove('lock-scroll', 'no-scroll', 'modal-open', 'overflow-hidden');
        }

        // Inicia watcher imediatamente e continua rodando
        document.addEventListener('DOMContentLoaded', function () {
          setInterval(unlock, 300);
          unlock();
        });

        // Escuta fechamento de qualquer dialog/modal via atributo Radix
        var observer = new MutationObserver(function (mutations) {
          mutations.forEach(function (m) {
            if (m.type === 'attributes' && m.attributeName === 'style') {
              unlock();
            }
            if (m.type === 'childList') {
              unlock();
            }
          });
        });

        document.addEventListener('DOMContentLoaded', function () {
          observer.observe(document.body, {
            attributes: true,
            childList: true,
            subtree: false,
          });
          observer.observe(document.documentElement, {
            attributes: true,
            childList: false,
          });
        });
      })();
    </script>
